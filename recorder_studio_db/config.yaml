name: Recorder Studio DB
version: "0.1.3"
slug: recorder_studio_db
description: Run and manage the Home Assistant recorder database (SQLite, PostgreSQL or MariaDB) with Recorder Studio built in.
url: https://github.com/r3mcos3/recorder-studio-db
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
homeassistant_api: true
hassio_api: true
hassio_role: backup
ingress: true
ingress_port: 8099
panel_icon: mdi:database-cog
panel_title: Recorder Studio
panel_admin: true
map:
  - homeassistant_config:rw
options:
  engine: sqlite
  log_level: info
schema:
  engine: list(sqlite|postgresql|mariadb)
  log_level: list(debug|info|warning|error)
