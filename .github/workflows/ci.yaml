name: CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: pw, POSTGRES_DB: ha}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11
        env: {MARIADB_ROOT_PASSWORD: pw, MARIADB_DATABASE: ha}
        ports: ["3306:3306"]
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_DSN: host=127.0.0.1 port=5432 dbname=ha user=postgres password=pw
      TEST_MARIADB: 127.0.0.1:3306:root:pw:ha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install aiohttp pytest pytest-aiohttp pyyaml psycopg2-binary pymysql cryptography
      - run: pytest -q -rs
  addon-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t recorder-studio-db recorder_studio_db
      - name: Smoke test (SQLite mode serves the panel)
        run: |
          docker run -d --name rs -e STUDIO_DEV=1 -e DATA_DIR=/tmp/d -e CONFIG_DIR=/tmp/c -p 8099:8099 recorder-studio-db
          for i in $(seq 1 20); do curl -sf localhost:8099/ >/dev/null && break; sleep 1; done
          curl -sf localhost:8099/ | grep -q recorder-studio-panel || { docker logs rs; exit 1; }
          curl -sf -X POST localhost:8099/api/command -d '{"type":"recorder_studio/backup_status"}'
  engines:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [postgresql, mariadb]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t recorder-studio-db recorder_studio_db
      - name: Start the add-on with the ${{ matrix.engine }} engine, restart it, and check the server comes up each time
        run: |
          mkdir -p data config
          echo '{"engine": "${{ matrix.engine }}"}' > data/options.json
          docker run -d --name rs -v "$PWD/data:/data" -v "$PWD/config:/homeassistant" -e STUDIO_DEV=1 -p 8099:8099 recorder-studio-db
          wait_running() {
            for i in $(seq 1 120); do
              curl -sf -X POST localhost:8099/api/command -d '{"type":"recorder_studio/db_status"}' | grep -q '"state": "running", "error": null' && return 0
              sleep 1
            done
            return 1
          }
          wait_running || { docker logs rs; exit 1; }
          curl -sf -X POST localhost:8099/api/command -d '{"type":"recorder_studio/db_status"}'; echo
          docker restart rs
          wait_running || { docker logs rs; exit 1; }
          echo "restart OK"
      - name: Switch engine from the panel API (to the other server and back), no add-on restart
        run: |
          call() { curl -s -X POST localhost:8099/api/command -d "$1"; }
          wait_for() {
            for i in $(seq 1 120); do
              call '{"type":"recorder_studio/db_status"}' | grep -q "\"engine\": \"$1\", \"state\": \"running\", \"error\": null" && return 0
              sleep 1
            done
            return 1
          }
          other=$([ "${{ matrix.engine }}" = postgresql ] && echo mariadb || echo postgresql)
          call "{\"type\":\"recorder_studio/db_set_engine\",\"engine\":\"$other\",\"confirm\":true}" | grep -q '"result"' || { docker logs rs; exit 1; }
          wait_for "$other" || { docker logs rs; exit 1; }
          call "{\"type\":\"recorder_studio/db_set_engine\",\"engine\":\"${{ matrix.engine }}\",\"confirm\":true}" | grep -q '"result"' || { docker logs rs; exit 1; }
          wait_for "${{ matrix.engine }}" || { docker logs rs; exit 1; }
          call '{"type":"recorder_studio/db_set_engine","engine":"sqlite","confirm":true}' | grep -q '"result"' || { docker logs rs; exit 1; }
          echo "switch OK"
      - name: Show the add-on log
        if: always()
        run: docker logs rs 2>&1 | tail -40
